# AGROTORK BRAIN — CI da aplicação (módulo src/modules/brain + app Next).
#
# O que protege: o código TypeScript do BRAIN e o app que o consome. O
# brain.yml cuida de outra coisa — banco, deploy/reversão e ingestão. Antes
# deste workflow, um PR que mexesse apenas em src/modules/brain/*.ts passava
# sem CI nenhum. Este workflow fecha esse buraco.
#
# Roda em TODO PR e em todo push em main, sem filtro de `paths`: `app-gates`
# é check obrigatório na branch protection, e check obrigatório de workflow
# filtrado por caminho nunca reporta em PR fora do filtro (só docs, por
# exemplo) — o PR trava em "Expected — Waiting for status". Rodar sempre
# custa cerca de um minuto por PR e não tem status fantasma.
#
# Provider nunca é chamado: as suítes são determinísticas (mesma entrada,
# mesmo veredito) e a chave do provider é server-only — o Preview do
# Netlify deliberadamente não a recebe, e o CI também não. Sem segredo aqui.
#
# Suíte que falha = job vermelho. O contrato é o exit code de cada script;
# nada de conferir contagem fixa de asserções (foi assim que o CI anterior
# ficou verde com teste quebrado). conferir-ci-app.mjs garante que todo
# check:brain* do package.json tenha step aqui.
name: BRAIN App

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  # Inofensivo sem merge queue; com ela, sem este gatilho o app-gates nunca
  # reportaria na fila.
  merge_group:

permissions:
  contents: read

concurrency:
  group: brain-app-${{ github.workflow }}-${{ github.ref }}
  # Push novo no PR cancela a rodada velha; em main nunca — cada merge
  # precisa do seu veredito.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  app-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    # Ordem: barato antes de caro. Guarda e suítes (menos de um segundo cada)
    # apontam o erro antes de lint, typecheck e build, que levam dezenas de
    # segundos.
    steps:
      # Actions fixadas por SHA de commit (a tag pode ser movida; o SHA não).
      # Conferência: docs/brain/ci.md, seção "Actions fixadas".
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # O job só lê o código; o token não fica no .git/config do runner.
          persist-credentials: false
      - name: Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # 22 = LTS atual, é o runtime em que o projeto é desenvolvido e
          # validado; Next 16 exige >= 20.9, e --experimental-strip-types
          # roda limpo no 22.22.
          node-version: "22"
          cache: npm
      - name: Dependencies
        run: npm ci
      - name: CI guard
        run: npm run check:brain-ci
      - name: BRAIN core
        run: npm run check:brain
      - name: Answer validator
        run: npm run check:brain-answer
      - name: Provider adapter
        run: npm run check:brain-provider
      - name: BRAIN UI
        run: npm run check:brain-ui
      - name: Comparison V1
        run: npm run check:brain-comparison
      - name: Synthesis state machine
        run: npm run check:brain-synthesis
      - name: ESLint
        run: npm run lint
      - name: TypeScript
        run: npm run typecheck
      - name: Next build
        run: npm run build
