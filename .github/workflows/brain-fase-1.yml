name: BRAIN Fase 1

on:
  push:
    branches: [brain/fase-1]
  pull_request:
    paths:
      - 'supabase/**'
      - '.github/workflows/brain-fase-1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-reversao:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_PASSWORD: ci-local-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: ci-local-only
    steps:
      - uses: actions/checkout@v5
      - name: Conferir arquivos gerados
        run: bash supabase/db-tests/conferir-operacao.sh
      - name: Ensaiar deploy, reversao e ERP previamente povoado
        run: bash supabase/db-tests/ensaiar-deploy.sh
