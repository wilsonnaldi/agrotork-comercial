# AGROTORK BRAIN — CI de checkpoint (Fase 1 em modo desacoplado + Fase 2, Lotes A e B).
# Era brain-fase-1.yml; renomeado quando passou a validar a Fase 2 (historico
# preservado por `git mv`).
#
# Tres jobs, e so UM deles e check obrigatorio:
#
#   scope           -> descobre, pelo git, se o diff toca banco/worker/este
#                      workflow. Sai so `db=true|false`.
#   deploy-reversao -> o ensaio pesado (Postgres de servico + worker Python).
#                      Roda apenas quando db=true.
#   brain-db-gate   -> SEMPRE roda (if: always()) e da o veredito final. E o
#                      check que a branch protection exige.
#
# Por que assim: o filtro antigo era `paths` no gatilho do PR. Check
# obrigatorio de workflow filtrado por caminho nunca reporta em PR fora do
# filtro, e o PR trava em "Expected — Waiting for status" (status
# fantasma). E exigir o proprio deploy-reversao tambem nao serve: job
# pulado por `if:` reporta SUCESSO, entao um scope quebrado aprovaria
# tudo em silencio. O gate confere as tres coisas juntas: scope concluiu,
# db e um booleano valido, e o job pesado tem o resultado que o db exige.
#
# Actions fixadas por SHA de commit; conferencia em docs/brain/ci.md.
name: BRAIN

on:
  # Sem `paths`: o filtro mora no job `scope`, para que `brain-db-gate`
  # reporte status em TODO PR.
  pull_request:
  # Push so em main. Com brain/fase-1|2 aqui, um PR cuja head fosse uma
  # dessas branches ganhava um SEGUNDO brain-db-gate no mesmo SHA, com diff
  # contra `before` (o push anterior) em vez do merge-base do PR — podia
  # ficar verde com a rodada do PR vermelha, e a branch protection nao
  # distingue as duas (revisao independente, 26/09).
  push:
    branches: [main]
  workflow_dispatch:
  # Inofensivo sem merge queue; com ela, sem este gatilho o brain-db-gate
  # nunca reportaria na fila. O scope trata o evento como desconhecido
  # (cai no `*)` do case -> db=true, roda tudo).
  merge_group:

permissions:
  contents: read

concurrency:
  group: brain-db-${{ github.ref }}
  # Push novo no PR cancela a rodada velha; em main nunca — cada merge
  # precisa do seu veredito.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      db: ${{ steps.diff.outputs.db }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # Historico inteiro: o merge-base com a base precisa existir aqui.
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        name: Mudou banco, operacao ou worker?
        # Contexto do GitHub entra SO por env, nunca interpolado no script:
        # `${{ }}` dentro de `run:` vira texto do shell antes de rodar, e o
        # que vem do evento seria executado. Na duvida (evento manual,
        # base estranha, historico reescrito) o scope escolhe db=true:
        # errar para o lado caro, nunca para o lado que pula o ensaio.
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          heavy() { echo "db=true" >> "$GITHUB_OUTPUT"; echo "scope: $1 -> roda tudo"; exit 0; }
          case "$EVENT" in
            pull_request) base="$BASE_SHA" ;;
            push)         base="$BEFORE_SHA" ;;
            *)            heavy "evento $EVENT" ;;
          esac
          [[ "$base" =~ ^[0-9a-f]{40}$ ]] || heavy "base invalida"
          [[ "$base" =~ ^0{40}$ ]] && heavy "push sem before (branch nova)"
          git cat-file -e "${base}^{commit}" 2>/dev/null || heavy "base fora do historico (force-push?)"
          mb=$(git merge-base "$base" HEAD) || heavy "sem merge-base"
          # Nomes de arquivo nunca passam pelo shell como codigo, nem vao
          # para stdout ou GITHUB_OUTPUT: vao para um arquivo NUL-separado
          # (um nome com espaco, quebra de linha ou `$(...)` e so dado) e so
          # o booleano sai daqui. Arquivo, nao pipe: com pipefail, grep -q
          # fechando cedo + SIGPIPE no git diff daria falso "nao mudou".
          # --no-renames: arquivo MOVIDO para fora de supabase/ ou brain/
          # sairia so com o nome novo (fora do filtro) e o ensaio seria
          # pulado; sem deteccao de rename, o nome antigo aparece como
          # removido e casa o filtro.
          git diff --no-renames --name-only -z "$mb" HEAD > "$RUNNER_TEMP/changed"
          if grep -zqE '^(supabase/|brain/|\.github/workflows/brain\.yml$)' "$RUNNER_TEMP/changed"; then
            echo "db=true" >> "$GITHUB_OUTPUT"; echo "scope: mudanca relevante -> roda"
          else
            echo "db=false" >> "$GITHUB_OUTPUT"; echo "scope: nada relevante -> pula"
          fi

  # O ensaio pesado. Pulado por `if:` ele reporta SUCESSO para a branch
  # protection — por isso NAO e check obrigatorio; quem decide e o
  # brain-db-gate.
  deploy-reversao:
    needs: scope
    if: needs.scope.outputs.db == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_PASSWORD: ci-local-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: ci-local-only
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Dependencias do worker de ingestao (Lote B)
        run: pip install --quiet -r brain/worker/requirements.txt
      - name: Conferir arquivos gerados
        run: bash supabase/db-tests/conferir-operacao.sh
      - name: Ensaiar deploy, reversao e ERP previamente povoado
        run: bash supabase/db-tests/ensaiar-deploy.sh
      - name: Ensaiar memoria corporativa (Fase 2, Lote A) — suites 33/34, regressao 25–32, remocao/reaplicacao, sem pgvector
        run: bash supabase/db-tests/ensaiar-memoria.sh
      - name: Ensaiar ingestao (Fase 2, Lote B) — suites 35/36, worker com PDF sintetico (tabela por geometria), pytest, remocao A+B e B-only, bucket so por roteiro
        run: bash supabase/db-tests/ensaiar-ingestao.sh

  # UNICO check obrigatorio do banco. Sempre reporta (if: always()), entao
  # nunca fica "Expected". Reprova se: scope nao concluiu; db nao e
  # true/false; db=true e o ensaio nao passou; db=false e o ensaio nao foi
  # pulado (rodou quando nao devia = o scope e o if divergiram).
  brain-db-gate:
    needs: [scope, deploy-reversao]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Veredito
        env:
          SCOPE: ${{ needs.scope.result }}
          DB: ${{ needs.scope.outputs.db }}
          HEAVY: ${{ needs.deploy-reversao.result }}
        run: |
          echo "scope=$SCOPE db=$DB deploy-reversao=$HEAVY"
          [ "$SCOPE" = success ] || { echo "::error::scope nao concluiu ($SCOPE)"; exit 1; }
          case "$DB" in
            true)  [ "$HEAVY" = success ] || { echo "::error::deploy-reversao: $HEAVY"; exit 1; } ;;
            false) [ "$HEAVY" = skipped ] || { echo "::error::esperava skipped, veio $HEAVY"; exit 1; } ;;
            *)     echo "::error::saida db invalida"; exit 1 ;;
          esac
