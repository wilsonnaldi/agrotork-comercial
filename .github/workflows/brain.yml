# AGROTORK BRAIN — CI de checkpoint (Fase 1 em modo desacoplado + Fase 2).
# Roda em push nas branches brain/* e em PR que toque o banco. Era
# brain-fase-1.yml; renomeado quando passou a validar a Fase 2 (historico
# preservado por `git mv`).
name: BRAIN

on:
  push:
    branches: [brain/fase-1, brain/fase-2]
  pull_request:
    paths:
      - 'supabase/**'
      - '.github/workflows/brain.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-reversao:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_PASSWORD: ci-local-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: ci-local-only
    steps:
      - uses: actions/checkout@v5
      - name: Conferir arquivos gerados
        run: bash supabase/db-tests/conferir-operacao.sh
      - name: Ensaiar deploy, reversao e ERP previamente povoado
        run: bash supabase/db-tests/ensaiar-deploy.sh
      - name: Ensaiar memoria corporativa (Fase 2, Lote A) — suites 33/34, regressao 25–32, remocao/reaplicacao, sem pgvector
        run: bash supabase/db-tests/ensaiar-memoria.sh
